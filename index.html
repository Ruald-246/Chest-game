<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Chest Hunter 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
            color: #fff;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        /* HUD Overlay */
        .hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid rgba(255, 215, 0, 0.5);
            backdrop-filter: blur(10px);
            font-size: 18px;
            pointer-events: none;
        }

        .hud-item {
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hud-value {
            color: #ffd700;
            font-weight: bold;
            font-size: 24px;
        }

        /* Crosshair */
        .crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99;
            transition: all 0.2s;
        }

        .crosshair.active {
            border-color: #ffd700;
            box-shadow: 0 0 20px #ffd700;
            width: 30px;
            height: 30px;
        }

        /* Instructions */
        .instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 30px;
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            z-index: 100;
            text-align: center;
        }

        .instructions p {
            margin: 5px 0;
            font-size: 14px;
            color: #ccc;
        }

        /* Message Display */
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px 50px;
            border-radius: 20px;
            border: 3px solid #ffd700;
            z-index: 200;
            font-size: 24px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .message.show {
            opacity: 1;
        }

        /* Loading Screen */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading h1 {
            font-size: 48px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ffd700, #ff8000, #a335ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .loading-bar {
            width: 300px;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff8000);
            width: 0%;
            transition: width 0.3s;
        }

        /* Mobile Controls */
        .mobile-controls {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        .mobile-controls.active {
            display: block;
        }

        .joystick-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 150px;
            height: 150px;
            pointer-events: auto;
        }

        .joystick-base {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 215, 0, 0.3);
            position: relative;
            backdrop-filter: blur(10px);
        }

        .joystick-stick {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.6);
            border: 3px solid rgba(255, 215, 0, 0.8);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s;
        }

        .mobile-buttons {
            position: absolute;
            bottom: 40px;
            right: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
        }

        .mobile-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.3);
            border: 3px solid rgba(255, 215, 0, 0.6);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .mobile-btn:active {
            background: rgba(255, 215, 0, 0.6);
            transform: scale(0.95);
        }

        /* Inventory Panel */
        .inventory-panel {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            width: 320px;
            max-height: 600px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 15px;
            padding: 20px;
            z-index: 100;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .inventory-panel.hidden {
            transform: translateY(-50%) translateX(400px);
            opacity: 0;
            pointer-events: none;
        }

        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }

        .inventory-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
        }

        .inventory-close {
            cursor: pointer;
            font-size: 24px;
            color: #ffd700;
            background: none;
            border: none;
            padding: 5px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .inventory-grid::-webkit-scrollbar {
            width: 8px;
        }

        .inventory-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .inventory-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.5);
            border-radius: 4px;
        }

        .inventory-slot {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .inventory-slot:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        .inventory-slot .item-icon-text {
            font-size: 28px;
            margin-bottom: 4px;
        }

        .inventory-slot .item-name-text {
            font-size: 9px;
            text-align: center;
            line-height: 1.1;
            color: #fff;
        }

        .inventory-slot .item-value-text {
            font-size: 10px;
            color: #ffd700;
            font-weight: bold;
        }

        .inventory-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #888;
            padding: 40px 20px;
        }

        .inventory-toggle {
            position: fixed;
            top: 120px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            z-index: 101;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .inventory-toggle:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.1);
        }

        .inventory-toggle .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4444;
            color: white;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* Item Tooltip */
        .item-tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 15px;
            z-index: 1000;
            pointer-events: none;
            min-width: 200px;
            display: none;
        }

        .item-tooltip.show {
            display: block;
        }

        .tooltip-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .tooltip-type {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
        }

        .tooltip-value {
            font-size: 14px;
            color: #ffd700;
            font-weight: bold;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .hud {
                padding: 10px;
                font-size: 14px;
                top: 10px;
                left: 10px;
            }

            .hud-value {
                font-size: 18px;
            }

            .instructions {
                display: none;
            }

            .crosshair {
                width: 30px;
                height: 30px;
            }

            .message {
                padding: 20px 30px;
                font-size: 18px;
            }

            .inventory-panel {
                width: calc(100% - 40px);
                right: 20px;
                max-height: 50vh;
            }

            .inventory-toggle {
                top: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading" id="loading">
        <h1>✨ Mystic Chest Hunter 3D ✨</h1>
        <div class="loading-bar">
            <div class="loading-progress" id="loadingProgress"></div>
        </div>
        <p style="margin-top: 20px; color: #ccc;">Loading magical realm...</p>
    </div>

    <!-- HUD -->
    <div class="hud">
        <div class="hud-item">
            <span>💰 Gold:</span>
            <span class="hud-value" id="goldDisplay">100</span>
        </div>
        <div class="hud-item">
            <span>📦 Opened:</span>
            <span class="hud-value" id="chestsDisplay">0</span>
        </div>
        <div class="hud-item">
            <span>⭐ Value:</span>
            <span class="hud-value" id="valueDisplay">0</span>
        </div>
    </div>

    <!-- Crosshair -->
    <div class="crosshair" id="crosshair"></div>

    <!-- Inventory Toggle Button -->
    <div class="inventory-toggle" id="inventoryToggle">
        🎒
        <span class="badge" id="inventoryCount">0</span>
    </div>

    <!-- Inventory Panel -->
    <div class="inventory-panel hidden" id="inventoryPanel">
        <div class="inventory-header">
            <div class="inventory-title">📦 Inventory</div>
            <button class="inventory-close" id="inventoryClose">✕</button>
        </div>
        <div class="inventory-grid" id="inventoryGridPanel"></div>
    </div>

    <!-- Item Tooltip -->
    <div class="item-tooltip" id="itemTooltip">
        <div class="tooltip-name" id="tooltipName"></div>
        <div class="tooltip-type" id="tooltipType"></div>
        <div class="tooltip-value" id="tooltipValue"></div>
    </div>

    <!-- Instructions -->
    <div class="instructions">
        <p><strong>WASD</strong> - Move | <strong>Mouse</strong> - Look | <strong>Click</strong> - Open Chest</p>
        <p><strong>Q</strong> - Sell All Items | <strong>I</strong> - Toggle Inventory</p>
    </div>

    <!-- Mobile Controls -->
    <div class="mobile-controls" id="mobileControls">
        <div class="joystick-container">
            <div class="joystick-base" id="joystickBase">
                <div class="joystick-stick" id="joystickStick"></div>
            </div>
        </div>
        <div class="mobile-buttons">
            <div class="mobile-btn" id="sellBtn">Q</div>
        </div>
    </div>

    <!-- Message Display -->
    <div class="message" id="message"></div>

    <!-- Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Game State
        const gameState = {
            gold: 100,
            chestsOpened: 0,
            totalValue: 0,
            inventory: []
        };

        // Chest Types with 3D Properties
        const chestTypes = [
            {
                name: 'Wooden Chest',
                rarity: 'common',
                cost: 10,
                color: 0x8B4513,
                emissive: 0x000000,
                emissiveIntensity: 0,
                itemCount: { min: 1, max: 2 },
                position: { x: -15, y: 0, z: -10 }
            },
            {
                name: 'Bronze Chest',
                rarity: 'uncommon',
                cost: 50,
                color: 0xCD7F32,
                emissive: 0x00ff00,
                emissiveIntensity: 0.2,
                itemCount: { min: 2, max: 3 },
                position: { x: -7.5, y: 0, z: -10 }
            },
            {
                name: 'Silver Chest',
                rarity: 'rare',
                cost: 200,
                color: 0xC0C0C0,
                emissive: 0x0070dd,
                emissiveIntensity: 0.3,
                itemCount: { min: 3, max: 4 },
                position: { x: 0, y: 0, z: -10 }
            },
            {
                name: 'Golden Chest',
                rarity: 'epic',
                cost: 1000,
                color: 0xFFD700,
                emissive: 0xa335ee,
                emissiveIntensity: 0.5,
                itemCount: { min: 4, max: 5 },
                position: { x: 7.5, y: 0, z: -10 }
            },
            {
                name: 'Diamond Chest',
                rarity: 'legendary',
                cost: 5000,
                color: 0x00FFFF,
                emissive: 0xff8000,
                emissiveIntensity: 0.8,
                itemCount: { min: 5, max: 7 },
                position: { x: 15, y: 0, z: -10 }
            }
        ];

        // Item Templates
        const itemTemplates = {
            weapons: { names: ['Sword', 'Bow', 'Staff', 'Dagger', 'Axe'], baseValue: 20, color: 0xff0000 },
            armor: { names: ['Helmet', 'Chestplate', 'Boots', 'Shield'], baseValue: 25, color: 0x0000ff },
            potions: { names: ['Health Potion', 'Mana Potion', 'Strength Potion'], baseValue: 15, color: 0x00ff00 },
            special: { names: ['Gem', 'Crown', 'Ring', 'Artifact'], baseValue: 50, color: 0xffff00 }
        };

        const rarityMultipliers = {
            common: { multiplier: 1, color: 0x9d9d9d },
            uncommon: { multiplier: 2, color: 0x1eff00 },
            rare: { multiplier: 5, color: 0x0070dd },
            epic: { multiplier: 10, color: 0xa335ee },
            legendary: { multiplier: 25, color: 0xff8000 }
        };

        // Three.js Setup
        let scene, camera, renderer, raycaster, mouse;
        let chestObjects = [];
        let particles = [];
        let floatingItems = [];
        let controls = { forward: false, backward: false, left: false, right: false };
        let velocity = new THREE.Vector3();
        let moveSpeed = 0.1;
        let selectedChest = null;

        // Mobile Detection
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // Mobile Touch Controls
        let joystickActive = false;
        let joystickVector = { x: 0, y: 0 };
        let lastTouchX = 0;
        let lastTouchY = 0;
        let touchStartX = 0;
        let touchStartY = 0;

        // Initialize Three.js
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000033, 0.02);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 2, 10);

            // Renderer
            const canvas = document.getElementById('gameCanvas');
            renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: !isMobile,
                powerPreference: isMobile ? 'low-power' : 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
            renderer.shadowMap.enabled = !isMobile;
            if (!isMobile) {
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            }

            // Raycaster for clicking
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lighting
            createLighting();

            // Environment
            createEnvironment();

            // Create Chests
            createChests();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Mobile vs Desktop Controls
            if (isMobile) {
                // Show mobile controls
                document.getElementById('mobileControls').classList.add('active');

                // Setup mobile touch controls
                setupMobileControls();

                // Touch events for camera rotation
                canvas.addEventListener('touchstart', onTouchStart);
                canvas.addEventListener('touchmove', onTouchMove);
                canvas.addEventListener('touchend', onTouchEnd);
            } else {
                // Desktop controls
                document.addEventListener('click', onMouseClick);
                document.addEventListener('mousemove', onMouseMove);

                // Pointer Lock for first-person controls
                canvas.addEventListener('click', () => {
                    canvas.requestPointerLock();
                });

                document.addEventListener('pointerlockchange', () => {
                    if (document.pointerLockElement === canvas) {
                        document.addEventListener('mousemove', onPointerMove);
                    } else {
                        document.removeEventListener('mousemove', onPointerMove);
                    }
                });
            }

            // Inventory event listeners
            document.getElementById('inventoryToggle').addEventListener('click', toggleInventoryPanel);
            document.getElementById('inventoryClose').addEventListener('click', toggleInventoryPanel);

            // Start Animation Loop
            animate();

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 1000);
        }

        function createLighting() {
            // Ambient Light
            const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
            scene.add(ambientLight);

            // Directional Light (moonlight)
            const directionalLight = new THREE.DirectionalLight(0x8888ff, 0.6);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // Point lights around chests
            chestTypes.forEach(chestType => {
                const pointLight = new THREE.PointLight(
                    chestType.emissive || 0xffffff,
                    chestType.emissiveIntensity * 3,
                    15
                );
                pointLight.position.set(chestType.position.x, 3, chestType.position.z);
                scene.add(pointLight);
            });
        }

        function createEnvironment() {
            // Mystical Void - Starfield (reduced on mobile)
            const starGeometry = new THREE.BufferGeometry();
            const starCount = isMobile ? 1000 : 5000;
            const starPositions = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount * 3; i += 3) {
                starPositions[i] = (Math.random() - 0.5) * 200;
                starPositions[i + 1] = (Math.random() - 0.5) * 200;
                starPositions[i + 2] = (Math.random() - 0.5) * 200;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));

            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.3,
                transparent: true,
                opacity: 0.8,
                sizeAttenuation: true
            });

            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);

            // Mystical Floor Platform
            const platformGeometry = new THREE.CylinderGeometry(30, 30, 0.5, 32);
            const platformMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a2e,
                emissive: 0x16213e,
                emissiveIntensity: 0.3,
                roughness: 0.7,
                metalness: 0.5
            });
            const platform = new THREE.Mesh(platformGeometry, platformMaterial);
            platform.position.y = -0.25;
            platform.receiveShadow = true;
            scene.add(platform);

            // Glowing Ring around platform
            const ringGeometry = new THREE.TorusGeometry(30, 0.3, 16, 100);
            const ringMaterial = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                emissive: 0xffd700,
                emissiveIntensity: 1,
                transparent: true,
                opacity: 0.6
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.position.y = 0;
            ring.rotation.x = Math.PI / 2;
            scene.add(ring);

            // Animated ring rotation
            function animateRing() {
                ring.rotation.z += 0.001;
                requestAnimationFrame(animateRing);
            }
            animateRing();
        }

        function createChests() {
            chestTypes.forEach((chestType, index) => {
                const chest = createChest(chestType);
                chest.userData.chestType = chestType;
                chest.userData.index = index;
                chestObjects.push(chest);
                scene.add(chest);

                // Add particle system for higher rarity chests
                if (chestType.emissiveIntensity > 0) {
                    createChestParticles(chest, chestType);
                }
            });
        }

        function createChest(chestType) {
            const chestGroup = new THREE.Group();

            // Chest Base (bottom part)
            const baseGeometry = new THREE.BoxGeometry(2, 1.5, 1.5);
            const baseMaterial = new THREE.MeshStandardMaterial({
                color: chestType.color,
                emissive: chestType.emissive,
                emissiveIntensity: chestType.emissiveIntensity,
                roughness: 0.5,
                metalness: 0.7
            });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.castShadow = true;
            base.receiveShadow = true;
            chestGroup.add(base);

            // Decorative metal bands
            const bandMaterial = new THREE.MeshStandardMaterial({
                color: 0x4a4a4a,
                roughness: 0.2,
                metalness: 0.9
            });

            // Horizontal bands
            for (let i = 0; i < 3; i++) {
                const bandGeometry = new THREE.BoxGeometry(2.1, 0.1, 1.6);
                const band = new THREE.Mesh(bandGeometry, bandMaterial);
                band.position.y = -0.5 + i * 0.5;
                chestGroup.add(band);
            }

            // Vertical corner bands
            for (let x of [-0.9, 0.9]) {
                const vertBandGeometry = new THREE.BoxGeometry(0.1, 1.6, 1.6);
                const vertBand = new THREE.Mesh(vertBandGeometry, bandMaterial);
                vertBand.position.x = x;
                chestGroup.add(vertBand);
            }

            // Chest Lid (top part)
            const lidGeometry = new THREE.BoxGeometry(2, 0.3, 1.5);
            const lid = new THREE.Mesh(lidGeometry, baseMaterial);
            lid.position.y = 0.9;
            lid.castShadow = true;
            chestGroup.add(lid);

            // Lid band
            const lidBandGeometry = new THREE.BoxGeometry(2.1, 0.15, 1.6);
            const lidBand = new THREE.Mesh(lidBandGeometry, bandMaterial);
            lidBand.position.y = 0.9;
            lid.add(lidBand);

            // Hinges
            for (let x of [-0.8, 0.8]) {
                const hingeGeometry = new THREE.BoxGeometry(0.15, 0.2, 0.2);
                const hinge = new THREE.Mesh(hingeGeometry, bandMaterial);
                hinge.position.set(x, 0.9, -0.7);
                chestGroup.add(hinge);
            }

            // Lock decoration (more detailed)
            const lockGroup = new THREE.Group();

            // Lock base plate
            const lockPlateGeometry = new THREE.BoxGeometry(0.4, 0.5, 0.15);
            const lockMaterial = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                emissive: 0xffd700,
                emissiveIntensity: 0.5,
                roughness: 0.3,
                metalness: 0.9
            });
            const lockPlate = new THREE.Mesh(lockPlateGeometry, lockMaterial);
            lockGroup.add(lockPlate);

            // Lock keyhole
            const keyholeGeometry = new THREE.CylinderGeometry(0.08, 0.08, 0.2, 8);
            const keyholeMaterial = new THREE.MeshStandardMaterial({
                color: 0x000000,
                roughness: 0.9,
                metalness: 0.1
            });
            const keyhole = new THREE.Mesh(keyholeGeometry, keyholeMaterial);
            keyhole.rotation.z = Math.PI / 2;
            keyhole.position.z = 0.05;
            lockGroup.add(keyhole);

            lockGroup.position.set(0, 0, 0.85);
            chestGroup.add(lockGroup);

            // Add gems/crystals for higher rarity chests
            if (chestType.rarity === 'epic' || chestType.rarity === 'legendary') {
                const gemCount = chestType.rarity === 'legendary' ? 5 : 3;
                for (let i = 0; i < gemCount; i++) {
                    const gemGeometry = new THREE.OctahedronGeometry(0.12, 0);
                    const gemMaterial = new THREE.MeshStandardMaterial({
                        color: chestType.emissive,
                        emissive: chestType.emissive,
                        emissiveIntensity: 1,
                        roughness: 0.1,
                        metalness: 0.1,
                        transparent: true,
                        opacity: 0.8
                    });
                    const gem = new THREE.Mesh(gemGeometry, gemMaterial);

                    const angle = (i / gemCount) * Math.PI * 2;
                    gem.position.set(
                        Math.cos(angle) * 0.9,
                        0,
                        Math.sin(angle) * 0.7
                    );
                    gem.rotation.y = angle;
                    chestGroup.add(gem);
                }
            }

            // Add floating runes for legendary chest
            if (chestType.rarity === 'legendary') {
                const runeGeometry = new THREE.TorusGeometry(0.3, 0.05, 8, 16);
                const runeMaterial = new THREE.MeshStandardMaterial({
                    color: chestType.emissive,
                    emissive: chestType.emissive,
                    emissiveIntensity: 1,
                    transparent: true,
                    opacity: 0.6
                });
                const rune = new THREE.Mesh(runeGeometry, runeMaterial);
                rune.rotation.x = Math.PI / 2;
                rune.position.y = -0.8;
                chestGroup.add(rune);

                // Store for animation
                chestGroup.userData.rune = rune;
            }

            // Position chest
            chestGroup.position.set(
                chestType.position.x,
                1.5,
                chestType.position.z
            );

            // Store references for opening animation
            chestGroup.userData.lid = lid;
            chestGroup.userData.lock = lockGroup;
            chestGroup.userData.isOpening = false;
            chestGroup.userData.isOpen = false;

            return chestGroup;
        }

        function createChestParticles(chest, chestType) {
            const particleCount = Math.floor(chestType.emissiveIntensity * (isMobile ? 30 : 100));
            const particleGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            const particleMaterial = new THREE.PointsMaterial({
                color: chestType.emissive,
                size: 0.1,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 3;
                positions[i + 1] = Math.random() * 3;
                positions[i + 2] = (Math.random() - 0.5) * 3;
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
            particleSystem.position.copy(chest.position);

            scene.add(particleSystem);
            particles.push({ system: particleSystem, chest: chest });
        }

        function openChest(chest) {
            const chestType = chest.userData.chestType;

            if (gameState.gold < chestType.cost) {
                showMessage('Not enough gold! 💰', '#ff0000');
                return;
            }

            if (chest.userData.isOpening || chest.userData.isOpen) {
                return;
            }

            // Deduct cost
            gameState.gold -= chestType.cost;
            gameState.chestsOpened++;
            chest.userData.isOpening = true;

            // Opening animation
            animateChestOpening(chest, chestType);

            // Update UI
            updateHUD();
        }

        function animateChestOpening(chest, chestType) {
            const lid = chest.userData.lid;
            const lock = chest.userData.lock;
            let angle = 0;
            const maxAngle = Math.PI * 0.6;

            // Create explosion of light
            createLightExplosion(chest.position, chestType.emissive);

            // Animate lid opening
            const openInterval = setInterval(() => {
                angle += 0.05;
                lid.rotation.x = -angle;
                lid.position.z = Math.sin(angle) * 0.75;
                lid.position.y = 0.9 + Math.sin(angle) * 0.5;

                // Make lock disappear
                lock.scale.multiplyScalar(0.95);

                if (angle >= maxAngle) {
                    clearInterval(openInterval);
                    chest.userData.isOpening = false;
                    chest.userData.isOpen = true;

                    // Generate and spawn items
                    setTimeout(() => {
                        spawnItems(chest, chestType);
                    }, 500);
                }
            }, 16);
        }

        function createLightExplosion(position, color) {
            // Create expanding light sphere
            const explosionGeometry = new THREE.SphereGeometry(0.5, 16, 16);
            const explosionMaterial = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 1
            });
            const explosion = new THREE.Mesh(explosionGeometry, explosionMaterial);
            explosion.position.copy(position);
            scene.add(explosion);

            // Animate explosion
            let scale = 1;
            const expandInterval = setInterval(() => {
                scale += 0.3;
                explosion.scale.set(scale, scale, scale);
                explosionMaterial.opacity -= 0.05;

                if (explosionMaterial.opacity <= 0) {
                    clearInterval(expandInterval);
                    scene.remove(explosion);
                }
            }, 16);

            // Particle burst
            createParticleBurst(position, color);
        }

        function createParticleBurst(position, color) {
            const particleCount = isMobile ? 20 : 50;
            for (let i = 0; i < particleCount; i++) {
                const geometry = new THREE.SphereGeometry(0.05, 8, 8);
                const material = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 1
                });
                const particle = new THREE.Mesh(geometry, material);
                particle.position.copy(position);

                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.3,
                    Math.random() * 0.3,
                    (Math.random() - 0.5) * 0.3
                );

                scene.add(particle);

                // Animate particle
                const lifetime = 60;
                let frame = 0;
                const animateParticle = () => {
                    frame++;
                    particle.position.add(velocity);
                    velocity.y -= 0.005; // gravity
                    material.opacity -= 1 / lifetime;

                    if (frame < lifetime) {
                        requestAnimationFrame(animateParticle);
                    } else {
                        scene.remove(particle);
                    }
                };
                animateParticle();
            }
        }

        function spawnItems(chest, chestType) {
            const itemCount = Math.floor(
                Math.random() * (chestType.itemCount.max - chestType.itemCount.min + 1)
            ) + chestType.itemCount.min;

            const items = [];
            for (let i = 0; i < itemCount; i++) {
                items.push(generateItem());
            }

            // Create 3D items floating out with animation
            items.forEach((item, index) => {
                setTimeout(() => {
                    createFloatingItem(item, chest.position, index, items.length);
                    gameState.inventory.push(item);
                    gameState.totalValue += item.value;
                }, index * 200);
            });

            // Auto-collect after all items are shown
            setTimeout(() => {
                floatingItems.forEach(itemMesh => {
                    scene.remove(itemMesh);
                });
                floatingItems = [];
                showMessage(`Collected ${itemCount} items! ✨`, '#00ff00');
                updateHUD();
                updateInventoryPanel();
            }, items.length * 200 + 1500); // Wait for all items to spawn + 1.5s display time

            showMessage(`Found ${itemCount} items!`, '#ffd700');
            updateHUD();
        }

        function generateItem() {
            const types = Object.keys(itemTemplates);
            const type = types[Math.floor(Math.random() * types.length)];
            const template = itemTemplates[type];

            const rarities = Object.keys(rarityMultipliers);
            const rarity = rarities[Math.floor(Math.random() * rarities.length)];
            const rarityInfo = rarityMultipliers[rarity];

            const name = template.names[Math.floor(Math.random() * template.names.length)];
            const value = Math.floor(template.baseValue * rarityInfo.multiplier * (0.8 + Math.random() * 0.4));

            return {
                id: Date.now() + Math.random(),
                type: type,
                name: name,
                rarity: rarity,
                value: value,
                color: template.color
            };
        }

                const bottleGeometry = new THREE.CylinderGeometry(0.12, 0.15, 0.5, 8);
                const bottle = new THREE.Mesh(bottleGeometry, new THREE.MeshStandardMaterial({
                    color: item.color,
                    emissive: rarityMultipliers[item.rarity].color,

                }));
                itemGroup.add(bottle);

                // Cork
                const corkGeometry = new THREE.CylinderGeometry(0.08, 0.08, 0.12, 8);
                const cork = new THREE.Mesh(corkGeometry, new THREE.MeshStandardMaterial({
                    color: 0x8B4513,
                    roughness: 0.9,
                    metalness: 0.1
                }));
                cork.position.y = 0.31;
                itemGroup.add(cork);

                // Liquid glow inside

                const liquid = new THREE.Mesh(liquidGeometry, new THREE.MeshStandardMaterial({
                    color: rarityMultipliers[item.rarity].color,
                    emissive: rarityMultipliers[item.rarity].color,

                    color: rarityMultipliers[item.rarity].color,
                    transparent: true,

                for (let i = 0; i < 3; i++) {

            context.fillRect(0, 0, canvas.width, canvas.height);

            floatingItems.push(itemGroup);

        function sellAllItems() {
            if (gameState.inventory.length === 0) {
                showMessage('No items to sell!', '#ff8800');
                return;
            }

            const totalValue = gameState.inventory.reduce((sum, item) => sum + item.value, 0);
            gameState.gold += totalValue;
            gameState.inventory = [];

            showMessage(`Sold all items for ${totalValue} gold! 💰`, '#00ff00');
            updateHUD();
            updateInventoryPanel();
        }

        function showMessage(text, color) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.style.borderColor = color;
            messageEl.classList.add('show');

            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 2000);
        }

        function updateHUD() {
            document.getElementById('goldDisplay').textContent = gameState.gold.toLocaleString();
            document.getElementById('chestsDisplay').textContent = gameState.chestsOpened.toLocaleString();
            document.getElementById('valueDisplay').textContent = gameState.totalValue.toLocaleString();
            document.getElementById('inventoryCount').textContent = gameState.inventory.length;
        }

        function updateInventoryPanel() {
            const gridPanel = document.getElementById('inventoryGridPanel');
            gridPanel.innerHTML = '';

            if (gameState.inventory.length === 0) {
                gridPanel.innerHTML = '<div class="inventory-empty">No items collected yet!<br>Open chests to find treasures.</div>';
                return;
            }

            gameState.inventory.forEach((item, index) => {
                const slot = document.createElement('div');
                slot.className = 'inventory-slot';
                slot.style.borderColor = '#' + rarityMultipliers[item.rarity].color.toString(16).padStart(6, '0');

                // Get item icon based on type
                let icon = '⚔️';
                if (item.type === 'armor') icon = '🛡️';
                else if (item.type === 'potions') icon = '🧪';
                else if (item.type === 'special') icon = '💎';

                slot.innerHTML = `
                    <div class="item-icon-text">${icon}</div>
                    <div class="item-name-text">${item.name}</div>
                    <div class="item-value-text">${item.value}g</div>
                `;

                // Add hover tooltip
                slot.addEventListener('mouseenter', (e) => showTooltip(item, e));
                slot.addEventListener('mouseleave', hideTooltip);

                // Click to sell
                slot.addEventListener('click', () => {
                    sellSingleItem(index);
                });

                gridPanel.appendChild(slot);
            });
        }

        function showTooltip(item, event) {
            const tooltip = document.getElementById('itemTooltip');
            document.getElementById('tooltipName').textContent = item.name;
            document.getElementById('tooltipName').style.color = '#' + rarityMultipliers[item.rarity].color.toString(16).padStart(6, '0');
            document.getElementById('tooltipType').textContent = `${rarityMultipliers[item.rarity].name || item.rarity} ${item.type}`;
            document.getElementById('tooltipValue').textContent = `Value: ${item.value} gold`;

            tooltip.style.left = (event.clientX + 15) + 'px';
            tooltip.style.top = (event.clientY + 15) + 'px';
            tooltip.classList.add('show');
        }

        function hideTooltip() {
            document.getElementById('itemTooltip').classList.remove('show');
        }

        function toggleInventoryPanel() {
            const panel = document.getElementById('inventoryPanel');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
                updateInventoryPanel();
            }
        }

        function sellSingleItem(index) {
            if (index >= 0 && index < gameState.inventory.length) {
                const item = gameState.inventory[index];
                gameState.gold += item.value;
                gameState.inventory.splice(index, 1);
                updateHUD();
                updateInventoryPanel();
                showMessage(`Sold ${item.name} for ${item.value} gold!`, '#00ff00');
            }
        }

        // Mobile Controls Setup
        function setupMobileControls() {
            const joystickBase = document.getElementById('joystickBase');
            const joystickStick = document.getElementById('joystickStick');
            const sellBtn = document.getElementById('sellBtn');

            // Joystick touch handling
            joystickBase.addEventListener('touchstart', (e) => {
                e.preventDefault();
                joystickActive = true;
                updateJoystick(e.touches[0]);
            });

            joystickBase.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (joystickActive) {
                    updateJoystick(e.touches[0]);
                }
            });

            joystickBase.addEventListener('touchend', (e) => {
                e.preventDefault();
                joystickActive = false;
                joystickVector = { x: 0, y: 0 };
                joystickStick.style.transform = 'translate(-50%, -50%)';
            });

            function updateJoystick(touch) {
                const rect = joystickBase.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const deltaX = touch.clientX - centerX;
                const deltaY = touch.clientY - centerY;

                const distance = Math.min(Math.sqrt(deltaX * deltaX + deltaY * deltaY), 45);
                const angle = Math.atan2(deltaY, deltaX);

                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;

                joystickStick.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;

                // Normalize joystick vector
                joystickVector.x = x / 45;
                joystickVector.y = y / 45;
            }

            // Button handler
            sellBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                sellAllItems();
            });
        }

        // Touch Handlers for Camera Rotation and Chest Selection
        function onTouchStart(event) {
            if (event.touches.length === 1) {
                touchStartX = event.touches[0].clientX;
                touchStartY = event.touches[0].clientY;
                lastTouchX = touchStartX;
                lastTouchY = touchStartY;

                // Check for chest tap
                const touch = event.touches[0];
                mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(chestObjects, true);

                if (intersects.length > 0) {
                    const intersectedChest = intersects[0].object.parent;
                    // Store for potential tap
                    selectedChest = intersectedChest;
                }
            }
        }

        function onTouchMove(event) {
            event.preventDefault();

            if (event.touches.length === 1) {
                const touch = event.touches[0];
                const deltaX = touch.clientX - lastTouchX;
                const deltaY = touch.clientY - lastTouchY;

                // Only rotate if moved significantly (to distinguish from tap)
                const moveDistance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                if (moveDistance > 5) {
                    // Rotate camera
                    camera.rotation.y -= deltaX * 0.005;
                    camera.rotation.x -= deltaY * 0.005;

                    // Limit vertical rotation
                    camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));

                    selectedChest = null; // Cancel tap if dragging
                }

                lastTouchX = touch.clientX;
                lastTouchY = touch.clientY;
            }
        }

        function onTouchEnd(event) {
            // If we still have a selected chest, it's a tap (not a drag)
            if (selectedChest) {
                const touchEndX = lastTouchX;
                const touchEndY = lastTouchY;
                const dragDistance = Math.sqrt(
                    Math.pow(touchEndX - touchStartX, 2) + Math.pow(touchEndY - touchStartY, 2)
                );

                // Only open if it was a tap (minimal drag)
                if (dragDistance < 10) {
                    openChest(selectedChest);
                }
            }

            selectedChest = null;
        }

        // Input Handlers
        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW': controls.forward = true; break;
                case 'KeyS': controls.backward = true; break;
                case 'KeyA': controls.left = true; break;
                case 'KeyD': controls.right = true; break;
                case 'KeyQ': sellAllItems(); break;
                case 'KeyI': toggleInventoryPanel(); break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': controls.forward = false; break;
                case 'KeyS': controls.backward = false; break;
                case 'KeyA': controls.left = false; break;
                case 'KeyD': controls.right = false; break;
            }
        }

        function onMouseMove(event) {
            // Update raycaster for hover detection
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onPointerMove(event) {
            // First-person camera rotation
            const movementX = event.movementX || 0;
            const movementY = event.movementY || 0;

            camera.rotation.y -= movementX * 0.002;
            camera.rotation.x -= movementY * 0.002;

            // Limit vertical rotation
            camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
        }

        function onMouseClick() {
            if (selectedChest) {
                openChest(selectedChest);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Update movement
            updateMovement();

            // Update raycaster
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera); // Center of screen
            const intersects = raycaster.intersectObjects(chestObjects, true);

            if (intersects.length > 0) {
                const intersectedChest = intersects[0].object.parent;
                selectedChest = intersectedChest;
                document.getElementById('crosshair').classList.add('active');
            } else {
                selectedChest = null;
                document.getElementById('crosshair').classList.remove('active');
            }

            // Animate particles
            particles.forEach(({ system, chest }) => {
                const positions = system.geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i + 1] += 0.02;
                    if (positions[i + 1] > 3) {
                        positions[i + 1] = 0;
                    }
                }
                system.geometry.attributes.position.needsUpdate = true;
            });

            // Animate floating items
            floatingItems.forEach(itemMesh => {
                itemMesh.rotation.y += itemMesh.userData.rotationSpeed;
                const floatAmount = Math.sin(Date.now() * 0.001 + itemMesh.userData.floatOffset) * 0.1;
                itemMesh.position.y = itemMesh.userData.initialY + floatAmount;
            });

            // Animate chest runes (legendary chests)
            chestObjects.forEach(chest => {
                if (chest.userData.rune) {
                    chest.userData.rune.rotation.z += 0.01;
                    chest.userData.rune.position.y = -0.8 + Math.sin(Date.now() * 0.002) * 0.1;
                }
            });

            renderer.render(scene, camera);
        }

        function updateMovement() {
            const direction = new THREE.Vector3();
            const right = new THREE.Vector3();

            camera.getWorldDirection(direction);
            direction.y = 0;
            direction.normalize();

            right.crossVectors(camera.up, direction).normalize();

            velocity.set(0, 0, 0);

            // Mobile joystick control
            if (isMobile && joystickActive) {
                // Forward/backward from joystick Y
                const forwardAmount = -joystickVector.y;
                velocity.add(direction.clone().multiplyScalar(forwardAmount));

                // Left/right from joystick X
                const rightAmount = joystickVector.x;
                velocity.add(right.clone().multiplyScalar(rightAmount));
            } else {
                // Desktop keyboard controls
                if (controls.forward) velocity.add(direction);
                if (controls.backward) velocity.sub(direction);
                if (controls.left) velocity.add(right);
                if (controls.right) velocity.sub(right);
            }

            if (velocity.length() > 0) {
                velocity.normalize().multiplyScalar(moveSpeed);
            }
            camera.position.add(velocity);

            // Keep camera above ground
            if (camera.position.y < 2) camera.position.y = 2;

            // Keep camera in bounds (on platform)
            const distFromCenter = Math.sqrt(camera.position.x ** 2 + camera.position.z ** 2);
            if (distFromCenter > 28) {
                camera.position.x = (camera.position.x / distFromCenter) * 28;
                camera.position.z = (camera.position.z / distFromCenter) * 28;
            }
        }

        // Initialize the game
        window.addEventListener('load', init);
    </script>
</body>
</html>
